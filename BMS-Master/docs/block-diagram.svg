<marker id="r" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ef4444"/></marker>
</defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<rect x="24.9" y="89.6" width="330.0" height="80.0" rx="3" fill="#c3fae8" stroke="#06b6d4" stroke-width="2"/>
<text x="189.9" y="118.8" font-size="18" fill="#0e7490" text-anchor="middle" dominant-baseline="middle" xml:space="preserve">Transformer COM port</text>
<text x="189.9" y="140.4" font-size="18" fill="#0e7490" text-anchor="middle" dominant-baseline="middle" xml:space="preserve">To module 1 (HV rated)</text>
<rect x="424.9" y="89.6" width="300.0" height="80.0" rx="3" fill="#ffec99" stroke="#f08c00" stroke-width="2"/>
<text x="574.9" y="118.8" font-size="18" fill="#b45309" text-anchor="middle" dominant-baseline="middle" xml:space="preserve">BQ79600-Q1 bridge</text>
<text x="574.9" y="140.4" font-size="18" fill="#b45309" text-anchor="middle" dominant-baseline="middle" xml:space="preserve">SPI + SPI_RDY + NFAULT</text>
<rect x="424.9" y="244.6" width="300.0" height="462.4" rx="3" fill="#b2f2bb" stroke="#22c55e" stroke-width="2"/>
<text x="574.9" y="403.8" font-size="20" fill="#15803d" text-anchor="middle" dominant-baseline="middle" xml:space="preserve">STM32</text>
<text x="574.9" y="427.8" font-size="20" fill="#15803d" text-anchor="middle" dominant-baseline="middle" xml:space="preserve"></text>
<text x="574.9" y="451.8" font-size="20" fill="#15803d" text-anchor="middle" dominant-baseline="middle" xml:space="preserve">Cell + temp limits</text>
<text x="574.9" y="475.8" font-size="20" fill="#15803d" text-anchor="middle" dominant-baseline="middle" xml:space="preserve">SoC estimation</text>
<text x="574.9" y="499.8" font-size="20" fill="#15803d" text-anchor="middle" dominant-baseline="middle" xml:space="preserve">Balancing control</text>
<text x="574.9" y="523.8" font-size="20" fill="#15803d" text-anchor="middle" dominant-baseline="middle" xml:space="preserve">Fault latch</text>
<text x="574.9" y="547.8" font-size="20" fill="#15803d" text-anchor="middle" dominant-baseline="middle" xml:space="preserve">CAN telemetry</text>
<rect x="24.9" y="244.6" width="330.0" height="85.0" rx="3" fill="#ffffff" stroke="#1e1e1e" stroke-width="2"/>
<text x="189.9" y="276.3" font-size="18" fill="#1e1e1e" text-anchor="middle" dominant-baseline="middle" xml:space="preserve">Current sensor</text>
<text x="189.9" y="297.9" font-size="18" fill="#1e1e1e" text-anchor="middle" dominant-baseline="middle" xml:space="preserve">LEM DHAB S/124</text>
<rect x="24.9" y="344.6" width="330.0" height="80.0" rx="3" fill="#ffffff" stroke="#1e1e1e" stroke-width="2"/>
<text x="189.9" y="373.8" font-size="18" fill="#1e1e1e" text-anchor="middle" dominant-baseline="middle" xml:space="preserve">Balancing master switch</text>
<text x="189.9" y="395.4" font-size="18" fill="#1e1e1e" text-anchor="middle" dominant-baseline="middle" xml:space="preserve">Force-off override only</text>
<rect x="787.9" y="371.8" width="340.0" height="110.0" rx="3" fill="#bac8ff" stroke="#4263eb" stroke-width="2"/>
<text x="957.9" y="396.2" font-size="17" fill="#3b4fc4" text-anchor="middle" dominant-baseline="middle" xml:space="preserve">CAN1 - full telemetry</text>
<text x="957.9" y="416.6" font-size="17" fill="#3b4fc4" text-anchor="middle" dominant-baseline="middle" xml:space="preserve">(charging / diagnostics)</text>
<text x="957.9" y="437.0" font-size="17" fill="#3b4fc4" text-anchor="middle" dominant-baseline="middle" xml:space="preserve">All 96 cells, 192 temps,</text>
<text x="957.9" y="457.4" font-size="17" fill="#3b4fc4" text-anchor="middle" dominant-baseline="middle" xml:space="preserve">balancing state, I, V</text>
<rect x="787.9" y="227.5" width="340.0" height="125.0" rx="3" fill="#a5d8ff" stroke="#4a9eed" stroke-width="2"/>
<text x="957.9" y="249.2" font-size="17" fill="#1d6fb8" text-anchor="middle" dominant-baseline="middle" xml:space="preserve">CAN2 - ECU / dashboard</text>
<text x="957.9" y="269.6" font-size="17" fill="#1d6fb8" text-anchor="middle" dominant-baseline="middle" xml:space="preserve">SoC (-2% margin)</text>
<text x="957.9" y="290.0" font-size="17" fill="#1d6fb8" text-anchor="middle" dominant-baseline="middle" xml:space="preserve">Max cell voltage</text>
<text x="957.9" y="310.4" font-size="17" fill="#1d6fb8" text-anchor="middle" dominant-baseline="middle" xml:space="preserve">Max temperature (+2 deg margin)</text>
<text x="957.9" y="330.8" font-size="17" fill="#1d6fb8" text-anchor="middle" dominant-baseline="middle" xml:space="preserve">Fault type code</text>
<rect x="787.9" y="501.1" width="340.0" height="90.0" rx="3" fill="#ffd8a8" stroke="#f59e0b" stroke-width="2"/>
<text x="957.9" y="525.7" font-size="17" fill="#b45309" text-anchor="middle" dominant-baseline="middle" xml:space="preserve">Charger reg bus (isolated)</text>
<text x="957.9" y="546.1" font-size="17" fill="#b45309" text-anchor="middle" dominant-baseline="middle" xml:space="preserve">Opto to pin 2 = STOP</text>
<text x="957.9" y="566.5" font-size="17" fill="#b45309" text-anchor="middle" dominant-baseline="middle" xml:space="preserve">GND = pack negative!</text>
<rect x="787.9" y="610.3" width="340.0" height="95.0" rx="3" fill="#ffc9c9" stroke="#ef4444" stroke-width="2"/>
<text x="957.9" y="637.4" font-size="17" fill="#b91c1c" text-anchor="middle" dominant-baseline="middle" xml:space="preserve">AMS_OK to SDC board (12 V = OK)</text>
<text x="957.9" y="657.8" font-size="17" fill="#b91c1c" text-anchor="middle" dominant-baseline="middle" xml:space="preserve">ONE signal, opens SDC</text>
<text x="957.9" y="678.2" font-size="17" fill="#b91c1c" text-anchor="middle" dominant-baseline="middle" xml:space="preserve">Fault type goes on CAN</text>
<rect x="426.5" y="764.2" width="300.0" height="85.0" rx="3" fill="#ffffff" stroke="#1e1e1e" stroke-width="2"/>
<text x="576.5" y="785.1" font-size="18" fill="#1e1e1e" text-anchor="middle" dominant-baseline="middle" xml:space="preserve">LV power (12 V in)</text>
<text x="576.5" y="806.7" font-size="18" fill="#1e1e1e" text-anchor="middle" dominant-baseline="middle" xml:space="preserve">Fuse, reverse polarity, TVS</text>
<text x="576.5" y="828.3" font-size="18" fill="#1e1e1e" text-anchor="middle" dominant-baseline="middle" xml:space="preserve">Buck 6.5 V, LDOs 5 V / 3.3 V</text>
<rect x="426.5" y="864.2" width="300.0" height="65.0" rx="3" fill="#ffc9c9" stroke="#ef4444" stroke-width="2"/>
<text x="576.5" y="886.5" font-size="17" fill="#b91c1c" text-anchor="middle" dominant-baseline="middle" xml:space="preserve">External watchdog: v2</text>
<text x="576.5" y="906.9" font-size="17" fill="#b91c1c" text-anchor="middle" dominant-baseline="middle" xml:space="preserve">v1 uses the STM32 IWDG</text>
<rect x="24.9" y="444.6" width="360.0" height="190.0" rx="3" fill="#eebefa" stroke="#9c36b5" stroke-width="2"/>
<text x="204.9" y="482.0" font-size="16" fill="#7e22a0" text-anchor="middle" dominant-baseline="middle" xml:space="preserve">Balancing = switch_on</text>
<text x="204.9" y="501.2" font-size="16" fill="#7e22a0" text-anchor="middle" dominant-baseline="middle" xml:space="preserve">AND no_fault AND temps_ok</text>
<text x="204.9" y="520.4" font-size="16" fill="#7e22a0" text-anchor="middle" dominant-baseline="middle" xml:space="preserve">AND max_cell &gt; 3.9 V</text>
<text x="204.9" y="539.6" font-size="16" fill="#7e22a0" text-anchor="middle" dominant-baseline="middle" xml:space="preserve">AND spread &gt; 20 mV</text>
<text x="204.9" y="558.8" font-size="16" fill="#7e22a0" text-anchor="middle" dominant-baseline="middle" xml:space="preserve">AND not driving</text>
<text x="204.9" y="578.0" font-size="16" fill="#7e22a0" text-anchor="middle" dominant-baseline="middle" xml:space="preserve">Runs with charger unplugged</text>
<text x="204.9" y="597.2" font-size="16" fill="#7e22a0" text-anchor="middle" dominant-baseline="middle" xml:space="preserve">Stops when spread closes</text>
<rect x="782.9" y="724.6" width="351.3" height="169.3" rx="3" fill="#eebefa" stroke="#9c36b5" stroke-width="2"/>
<text x="958.6" y="758.3" font-size="17" fill="#7e22a0" text-anchor="middle" dominant-baseline="middle" xml:space="preserve">Must stay in the BMS</text>
<text x="958.6" y="778.7" font-size="17" fill="#7e22a0" text-anchor="middle" dominant-baseline="middle" xml:space="preserve">- AMS opens SDC itself,</text>
<text x="958.6" y="799.1" font-size="17" fill="#7e22a0" text-anchor="middle" dominant-baseline="middle" xml:space="preserve">  not via ECU over CAN</text>
<text x="958.6" y="819.5" font-size="17" fill="#7e22a0" text-anchor="middle" dominant-baseline="middle" xml:space="preserve">- Fault must latch</text>
<text x="958.6" y="839.9" font-size="17" fill="#7e22a0" text-anchor="middle" dominant-baseline="middle" xml:space="preserve">- Must work while charging</text>
<text x="958.6" y="860.3" font-size="17" fill="#7e22a0" text-anchor="middle" dominant-baseline="middle" xml:space="preserve">- Check FSUK EV5.8 / EV6.1</text>
