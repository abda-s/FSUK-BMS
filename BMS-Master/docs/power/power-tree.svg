<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 400" font-family="Arial, Helvetica, sans-serif">
  <title>BMS master power tree: LV 12 V through input protection to +12V, a buck to 6.5 V, then a 5 V LDO for the +5V rail and a 3.3 V LDO for the +3V3 rail. +12V also feeds the AMS_OK driver.</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1f24"/>
    </marker>
  </defs>
  <rect width="940" height="400" fill="#ffffff"/>

  <!-- LV input -->
  <rect x="20" y="160" width="120" height="64" rx="6" fill="#fff0e6" stroke="#d9480f" stroke-width="1.5"/>
  <text x="80" y="187" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1f24">LV battery</text>
  <text x="80" y="206" text-anchor="middle" font-size="12" fill="#59636d">12 V (11–16 V)</text>

  <!-- input protection -->
  <rect x="180" y="160" width="140" height="64" rx="6" fill="#fff0e6" stroke="#d9480f" stroke-width="1.5"/>
  <text x="250" y="187" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1f24">Input protection</text>
  <text x="250" y="206" text-anchor="middle" font-size="12" fill="#59636d">fuse · reverse pol. · TVS</text>
  <line x1="140" y1="192" x2="178" y2="192" stroke="#1a1f24" stroke-width="2" marker-end="url(#a)"/>

  <!-- +12V bus to buck -->
  <line x1="320" y1="192" x2="398" y2="192" stroke="#d9480f" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="358" y="182" text-anchor="middle" font-size="13" font-weight="bold" fill="#d9480f">+12V</text>
  <text x="353" y="240" font-size="11" fill="#59636d">139 mA max</text>

  <!-- buck -->
  <rect x="400" y="160" width="130" height="64" rx="6" fill="#e7f1fb" stroke="#1971c2" stroke-width="1.5"/>
  <text x="465" y="183" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1f24">Buck</text>
  <text x="465" y="200" text-anchor="middle" font-size="12" fill="#59636d">12 V → 6.5 V</text>
  <text x="465" y="215" text-anchor="middle" font-size="12" fill="#59636d">≥ 0.5 A</text>

  <!-- split -->
  <line x1="530" y1="192" x2="560" y2="192" stroke="#1971c2" stroke-width="2.5"/>
  <circle cx="560" cy="192" r="3.5" fill="#1971c2"/>
  <text x="552" y="242" text-anchor="end" font-size="11" fill="#59636d">6.5 V</text>
  <text x="552" y="256" text-anchor="end" font-size="11" fill="#59636d">233 mA max</text>
  <polyline points="560,192 560,92 588,92" fill="none" stroke="#1971c2" stroke-width="2.5" marker-end="url(#a)"/>
  <polyline points="560,192 560,312 588,312" fill="none" stroke="#1971c2" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- 5V LDO -->
  <rect x="590" y="62" width="110" height="60" rx="6" fill="#e7f1fb" stroke="#1971c2" stroke-width="1.5"/>
  <text x="645" y="87" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1f24">LDO 5 V</text>
  <text x="645" y="106" text-anchor="middle" font-size="12" fill="#59636d">≥ 300 mA</text>
  <line x1="700" y1="92" x2="728" y2="92" stroke="#2f9e44" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- +5V rail -->
  <rect x="730" y="46" width="195" height="92" rx="6" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.5"/>
  <text x="745" y="68" font-size="14" font-weight="bold" fill="#2f9e44">+5V · 175 mA max</text>
  <text x="745" y="88" font-size="12" fill="#1a1f24">2× TCAN1042 (CAN)</text>
  <text x="745" y="105" font-size="12" fill="#1a1f24">BQ79600 bridge</text>
  <text x="745" y="122" font-size="12" fill="#1a1f24">DHAB S/124 current sensor</text>

  <!-- 3V3 LDO -->
  <rect x="590" y="282" width="110" height="60" rx="6" fill="#e7f1fb" stroke="#1971c2" stroke-width="1.5"/>
  <text x="645" y="307" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1f24">LDO 3.3 V</text>
  <text x="645" y="326" text-anchor="middle" font-size="12" fill="#59636d">≥ 150 mA</text>
  <line x1="700" y1="312" x2="728" y2="312" stroke="#2f9e44" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- +3V3 rail -->
  <rect x="730" y="266" width="195" height="92" rx="6" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.5"/>
  <text x="745" y="288" font-size="14" font-weight="bold" fill="#2f9e44">+3V3 · 58 mA max</text>
  <text x="745" y="308" font-size="12" fill="#1a1f24">STM32G474</text>
  <text x="745" y="325" font-size="12" fill="#1a1f24">BQ79600 / CAN I/O, pull-ups</text>
  <text x="745" y="342" font-size="12" fill="#1a1f24">charger opto LED</text>

  <!-- AMS_OK branch from +12V -->
  <circle cx="345" cy="192" r="3.5" fill="#d9480f"/>
  <polyline points="345,192 345,312 398,312" fill="none" stroke="#d9480f" stroke-width="2.5" marker-end="url(#a)"/>
  <rect x="400" y="282" width="150" height="60" rx="6" fill="#fff5f5" stroke="#c92a2a" stroke-width="1.5"/>
  <text x="475" y="307" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1f24">AMS_OK driver</text>
  <text x="475" y="326" text-anchor="middle" font-size="12" fill="#59636d">AMS_SDC · 1.6 mA</text>

  <text x="20" y="385" font-size="11.5" fill="#59636d">Currents are worst case (all loads at datasheet max). The LDOs remove buck ripple; the current sensor output is ratiometric to its 5 V supply.</text>
</svg>
